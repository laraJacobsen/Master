<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student -- Coding Question</title>
<style>
  :root {
    --navy: #1e2761;
    --ice: #cadcfc;
    --ok: #1c7293;
    --bad: #b85042;
    --bg: #f7f8fb;
    --card: #ffffff;
    --muted: #5a6072;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Calibri, Arial, sans-serif;
    background: var(--bg);
    color: #1a1a2e;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 1.25rem 1.5rem;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  main {
    max-width: 760px;
    margin: 1.5rem auto;
    padding: 0 1rem 3rem;
  }
  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 1.25rem;
  }
  label { display: block; font-weight: bold; margin-bottom: 0.3rem; font-size: 0.9rem; }
  input[type=text] {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border: 1px solid #d0d3dc;
    border-radius: 6px;
    font-size: 1rem;
    margin-bottom: 1rem;
  }
  #prompt-text { color: var(--muted); line-height: 1.5; }
  textarea {
    width: 100%;
    min-height: 220px;
    font-family: "Courier New", Consolas, monospace;
    font-size: 0.95rem;
    padding: 0.75rem;
    border: 1px solid #d0d3dc;
    border-radius: 6px;
    resize: vertical;
  }
  button {
    background: var(--navy);
    color: white;
    border: none;
    padding: 0.6rem 1.4rem;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 1rem;
  }
  button:disabled { background: #9aa0b5; cursor: not-allowed; }
  .spinner {
    display: none;
    width: 13px;
    height: 13px;
    border: 2px solid rgba(255,255,255,0.45);
    border-top-color: #fff;
    border-radius: 50%;
    margin-right: 0.5rem;
    vertical-align: -2px;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #submit-status {
    display: none;
    margin-top: 0.6rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #result { margin-top: 1.25rem; display: none; }
  .verdict-badge {
    display: inline-block;
    padding: 0.2rem 0.7rem;
    border-radius: 999px;
    font-weight: bold;
    font-size: 0.85rem;
    color: white;
  }
  .verdict-correct { background: #2c5f2d; }
  .verdict-partially_correct { background: #b8860b; }
  .verdict-incorrect, .verdict-error { background: var(--bad); }
  #feedback-text { margin-top: 0.75rem; line-height: 1.5; }
  #tier-note {
    display: none;
    margin-top: 0.75rem;
    font-size: 0.8rem;
    font-weight: bold;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #error-box {
    display: none;
    background: #fdeceb;
    border: 1px solid var(--bad);
    color: #7a2e24;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    margin-top: 1rem;
  }
  #traceback-box {
    display: none;
    margin-top: 1rem;
  }
  #traceback-box summary {
    cursor: pointer;
    font-weight: bold;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #traceback-box pre {
    margin-top: 0.5rem;
    background: #1a1a2e;
    color: #e6e6e6;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    font-family: "Courier New", Consolas, monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
<header><h1>Interactive Lecture -- Student</h1></header>
<main>
  <div class="card">
    <label for="name">Your name</label>
    <input type="text" id="name" placeholder="e.g. Lara Pinheiro">

    <label>Question</label>
    <div id="prompt-text">Loading question...</div>
  </div>

  <div class="card">
    <label for="code">Your code (Python)</label>
    <textarea id="code" spellcheck="false" placeholder="# read space-separated ints from stdin, print their sum
nums = input().split()
print(sum(int(n) for n in nums))"></textarea>
    <button id="submit-btn"><span id="submit-spinner" class="spinner"></span><span id="submit-btn-text">Submit</span></button>
    <div id="submit-status"></div>
    <div id="error-box"></div>
  </div>

  <div class="card" id="result">
    <span id="verdict-badge" class="verdict-badge"></span>
    <span id="score-text" style="margin-left:0.6rem; color:var(--muted);"></span>
    <div id="tier-note"></div>
    <div id="feedback-text"></div>
    <details id="traceback-box">
      <summary>Your program's error output</summary>
      <pre id="traceback-text"></pre>
    </details>
  </div>
</main>

<script>
  const API_BASE = ""; // same origin as this page when served by the FastAPI backend
  const QUESTION_ID = "sum-ints"; // MVP: single fixed question

  async function loadQuestion() {
    try {
      const res = await fetch(`${API_BASE}/api/questions`);
      const questions = await res.json();
      const q = questions.find(q => q.id === QUESTION_ID) || questions[0];
      document.getElementById("prompt-text").textContent = q ? q.prompt : "No question available.";
    } catch (e) {
      document.getElementById("prompt-text").textContent = "Could not load question (is the backend running?).";
    }
  }

  function setBadge(verdict) {
    const badge = document.getElementById("verdict-badge");
    badge.className = "verdict-badge verdict-" + verdict;
    const labels = {
      correct: "Correct",
      partially_correct: "Partially Correct",
      incorrect: "Incorrect",
      error: "Error",
    };
    badge.textContent = labels[verdict] || verdict;
  }

  async function submitCode() {
    const btn = document.getElementById("submit-btn");
    const errorBox = document.getElementById("error-box");
    const result = document.getElementById("result");
    const name = document.getElementById("name").value.trim();
    const code = document.getElementById("code").value;

    errorBox.style.display = "none";
    result.style.display = "none";

    if (!name) { errorBox.textContent = "Enter your name first."; errorBox.style.display = "block"; return; }
    if (!code.trim()) { errorBox.textContent = "Write some code first."; errorBox.style.display = "block"; return; }

    const spinner = document.getElementById("submit-spinner");
    const btnText = document.getElementById("submit-btn-text");
    const status = document.getElementById("submit-status");

    btn.disabled = true;
    spinner.style.display = "inline-block";
    btnText.textContent = "Running...";
    status.textContent = "Running your code on Judge0...";
    status.style.display = "block";
    const slowNotice = setTimeout(() => {
      status.textContent = "Still working -- AI grading can take up to a minute, especially on the first submission of a session.";
    }, 4000);

    try {
      const res = await fetch(`${API_BASE}/api/submit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ student_name: name, question_id: QUESTION_ID, source_code: code }),
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || "Submission failed.");
      }
      setBadge(data.verdict);
      document.getElementById("score-text").textContent =
        `${data.tests_passed}/${data.tests_total} tests passed`;
      const tierNote = document.getElementById("tier-note");
      if (data.hint_tier) {
        tierNote.textContent = `Attempt ${data.attempt_number} · Hint ${data.hint_tier}/${data.hint_ceiling}`;
        tierNote.style.display = "block";
      } else {
        tierNote.style.display = "none";
      }
      document.getElementById("feedback-text").textContent = data.feedback;
      const tracebackBox = document.getElementById("traceback-box");
      if (data.traceback) {
        document.getElementById("traceback-text").textContent = data.traceback;
        tracebackBox.style.display = "block";
      } else {
        tracebackBox.style.display = "none";
      }
      result.style.display = "block";
    } catch (e) {
      errorBox.textContent = e.message;
      errorBox.style.display = "block";
    } finally {
      clearTimeout(slowNotice);
      btn.disabled = false;
      spinner.style.display = "none";
      btnText.textContent = "Submit";
      status.style.display = "none";
    }
  }

  document.getElementById("submit-btn").addEventListener("click", submitCode);
  loadQuestion();
</script>
</body>
</html>
