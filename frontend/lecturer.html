<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecturer -- Live Submissions</title>
<style>
  :root {
    --navy: #1e2761;
    --bg: #f7f8fb;
    --card: #ffffff;
    --muted: #5a6072;
    --bad: #b85042;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Calibri, Arial, sans-serif;
    background: var(--bg);
    color: #1a1a2e;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 1.25rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  #stats { font-size: 0.95rem; opacity: 0.9; }
  main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem 3rem; }

  .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 1.25rem; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 1.1rem 1.3rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 1.25rem;
  }
  .card h2 { margin: 0 0 0.75rem; font-size: 1.05rem; }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem 0.4rem; border-bottom: 1px solid #eceef3; vertical-align: top; }
  th { color: var(--muted); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }

  .verdict-pill {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: bold;
    color: white;
    white-space: nowrap;
  }
  .verdict-correct { background: #2c5f2d; }
  .verdict-partially_correct { background: #b8860b; }
  .verdict-incorrect, .verdict-error { background: var(--bad); }

  #discussion-list { list-style: none; margin: 0; padding: 0; }
  #discussion-list li {
    padding: 0.6rem 0;
    border-bottom: 1px solid #eceef3;
    font-size: 0.9rem;
    line-height: 1.4;
  }
  #discussion-list li:last-child { border-bottom: none; }

  #empty-state { color: var(--muted); font-size: 0.9rem; }

  .view-example-btn {
    background: none;
    border: 1px solid #d0d3dc;
    color: var(--navy);
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .view-example-btn:hover { background: var(--bg); }

  .student-name-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--navy);
    font: inherit;
    text-decoration: underline dotted;
    cursor: pointer;
  }
  .student-name-btn:hover { color: var(--bad); }
  .detail-row td { padding: 0 0.4rem 0.75rem; border-bottom: 1px solid #eceef3; }
  .detail-row pre {
    display: block;
    background: var(--bg);
    border: 1px solid #d0d3dc;
    border-radius: 6px;
    padding: 0.6rem;
    font-size: 0.8rem;
    font-family: "Courier New", Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }

  .inspector-example { padding-bottom: 0.9rem; margin-bottom: 0.9rem; border-bottom: 1px solid #eceef3; }
  .inspector-example:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .inspector-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.6rem; }
  .inspector-diff { font-size: 0.85rem; margin-bottom: 0.9rem; }
  .inspector-diff div { margin-bottom: 0.3rem; }
  .inspector-diff code, .inspector-code {
    font-family: "Courier New", Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .inspector-code {
    display: block;
    background: var(--bg);
    border: 1px solid #d0d3dc;
    border-radius: 6px;
    padding: 0.75rem;
    font-size: 0.85rem;
    margin: 0;
  }
</style>
</head>
<body>
<header>
  <h1>Interactive Lecture -- Lecturer View</h1>
  <div id="stats"></div>
</header>
<main>
  <div class="grid">
    <div class="card">
      <h2>Submissions (live)</h2>
      <div id="empty-state">No submissions yet.</div>
      <table id="sub-table" style="display:none;">
        <thead>
          <tr><th>Time</th><th>Student</th><th>Result</th><th>Score</th></tr>
        </thead>
        <tbody id="sub-body"></tbody>
      </table>
    </div>
    <div class="card">
      <h2>Discussion points for the class</h2>
      <ul id="discussion-list"><li style="color:#5a6072;">Nothing yet.</li></ul>
    </div>
    <div class="card">
      <h2>Common issues (by count)</h2>
      <table id="cluster-table" style="display:none;">
        <thead>
          <tr><th>Issue</th><th>Count</th><th></th></tr>
        </thead>
        <tbody id="cluster-body"></tbody>
      </table>
      <div id="cluster-empty" style="color:#5a6072; font-size:0.9rem;">Nothing yet.</div>
    </div>
    <div class="card" id="inspector-card" style="display:none;">
      <h2 id="inspector-title">Example submission</h2>
      <div id="inspector-body"></div>
    </div>
  </div>
</main>

<script>
  const API_BASE = "";
  const POLL_MS = 3000;

  function verdictClass(v) { return "verdict-pill verdict-" + v; }
  function verdictLabel(v) {
    return { correct: "Correct", partially_correct: "Partial", incorrect: "Incorrect", error: "Error" }[v] || v;
  }

  // Rows from the last successful poll, kept around so toggling a student's code
  // open/closed can re-render instantly without waiting on (or triggering) a
  // fresh fetch, and submissions already carry source_code so no per-row
  // fetch is needed either.
  let lastSubRows = [];
  // Submission ids currently expanded in the table -- survives across polls
  // (which otherwise fully rebuild the tbody every 3s) so an open dropdown
  // doesn't snap shut on the next refresh.
  const expandedSubIds = new Set();

  function renderSubTable(rows) {
    const tbody = document.getElementById("sub-body");
    tbody.innerHTML = "";

    for (const row of rows) {
      const tr = document.createElement("tr");
      const time = (row.created_at || "").split(" ")[1] || row.created_at;
      const isOpen = expandedSubIds.has(row.id);
      tr.innerHTML = `
        <td>${time || ""}</td>
        <td><button class="student-name-btn" data-sub-id="${row.id}">${isOpen ? "▾" : "▸"} ${escapeHtml(row.student_name)}</button></td>
        <td><span class="${verdictClass(row.verdict)}">${verdictLabel(row.verdict)}</span></td>
        <td>${row.tests_passed}/${row.tests_total}</td>
      `;
      tbody.appendChild(tr);

      if (isOpen) {
        const detailTr = document.createElement("tr");
        detailTr.className = "detail-row";
        detailTr.innerHTML = `<td colspan="4"><pre>${escapeHtml(row.source_code)}</pre></td>`;
        tbody.appendChild(detailTr);
      }
    }
  }

  async function poll() {
    try {
      const res = await fetch(`${API_BASE}/api/lecturer/submissions`);
      const rows = await res.json();
      lastSubRows = rows;

      document.getElementById("stats").textContent = `${rows.length} submission${rows.length === 1 ? "" : "s"}`;

      if (rows.length === 0) {
        document.getElementById("empty-state").style.display = "block";
        document.getElementById("sub-table").style.display = "none";
        return;
      }
      document.getElementById("empty-state").style.display = "none";
      document.getElementById("sub-table").style.display = "table";

      renderSubTable(rows);
    } catch (e) {
      // Backend not reachable yet -- stay quiet and retry on the next poll.
    }
  }

  function clusterLabel(c) {
    if (c.exec_verdict === "rejected") return "Rejected submission";
    if (c.exec_verdict === "pass") return "Passing";
    const verdict = (c.exec_verdict || "unknown").replace(/_/g, " ");
    return c.error_type && c.error_type !== "none" ? `${verdict} (${c.error_type})` : verdict;
  }

  async function pollClusters() {
    try {
      const res = await fetch(`${API_BASE}/api/lecturer/clusters`);
      const clusters = await res.json();

      const table = document.getElementById("cluster-table");
      const empty = document.getElementById("cluster-empty");
      const body = document.getElementById("cluster-body");

      if (clusters.length === 0) {
        table.style.display = "none";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";
      table.style.display = "table";
      body.innerHTML = clusters.map(c => {
        const ids = c.submission_ids && c.submission_ids.length ? c.submission_ids : [c.example_submission_id];
        const label = ids.length > 1 ? `View all (${ids.length})` : "View code";
        return `
        <tr>
          <td>${escapeHtml(clusterLabel(c))}</td>
          <td>${c.count}</td>
          <td><button class="view-example-btn" data-sub-ids="${ids.join(",")}">${label}</button></td>
        </tr>
      `;
      }).join("");

      // Talking points are one per cluster (see aggregation.py), not one per
      // submission -- a cluster only has one once enough distinct students hit it,
      // so this naturally surfaces only the mistakes worth raising to the class,
      // already ranked by how many students share it (clusters is count-descending).
      const list = document.getElementById("discussion-list");
      const points = clusters.filter(c => c.discussion_point).map(c => c.discussion_point);
      list.innerHTML = points.length === 0
        ? '<li style="color:#5a6072;">Nothing yet.</li>'
        : points.map(d => `<li>${escapeHtml(d)}</li>`).join("");
    } catch (e) {
      // Backend not reachable yet -- stay quiet and retry on the next poll.
    }
  }

  // Renders one submission's meta/diff/code as an HTML block -- used both for a
  // single example and stacked when a cluster has several distinct students.
  function renderExampleBlock(sub) {
    const meta =
      `${escapeHtml(sub.student_name)} -- attempt ${sub.attempt_number} -- ${sub.tests_passed}/${sub.tests_total} passed`;

    let diff;
    const results = JSON.parse(sub.raw_test_results || "[]");
    const failing = results.find(r => !r.passed);
    if (failing) {
      const rows = [
        ["Input", failing.stdin],
        ["Expected output", failing.expected_stdout],
        ["Actual output", (failing.stdout || "").trim() || "(none)"],
      ];
      if (failing.stderr) rows.push(["Error output", failing.stderr]);
      diff = rows
        .map(([label, val]) => `<div><strong>${label}:</strong> <code>${escapeHtml(val ?? "")}</code></div>`)
        .join("");
    } else {
      diff = "<em>All test cases passed.</em>";
    }

    return `
      <div class="inspector-example">
        <div class="inspector-meta">${meta}</div>
        <div class="inspector-diff">${diff}</div>
        <code class="inspector-code">${escapeHtml(sub.source_code)}</code>
      </div>
    `;
  }

  // The lecturer shouldn't have to guess what a cluster's talking point means --
  // this fetches the actual example submissions (real student code, real
  // input/expected/actual output for the test case each failed) on demand, so the
  // discussion point is a starting point to investigate, not the only evidence.
  // A cluster can span several distinct students, so this fetches and stacks all
  // of them rather than picking just one.
  async function showExamples(subIds) {
    const card = document.getElementById("inspector-card");
    const title = document.getElementById("inspector-title");
    const body = document.getElementById("inspector-body");

    card.style.display = "block";
    title.textContent = subIds.length > 1 ? `Example submissions (${subIds.length})` : "Example submission";
    body.innerHTML = "Loading...";

    try {
      const subs = await Promise.all(
        subIds.map(async (subId) => {
          const res = await fetch(`${API_BASE}/api/lecturer/submissions/${subId}`);
          if (!res.ok) throw new Error("not found");
          return res.json();
        })
      );
      body.innerHTML = subs.map(renderExampleBlock).join("");
    } catch (e) {
      body.innerHTML = "Could not load one or more of these submissions.";
    }
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : String(s);
    return div.innerHTML;
  }

  // cluster-body itself is never replaced (only its innerHTML, every poll), so a
  // listener attached here keeps working across re-renders -- no need to
  // re-attach one per "View" button each time the table redraws.
  document.getElementById("cluster-body").addEventListener("click", (e) => {
    const btn = e.target.closest(".view-example-btn");
    if (btn) showExamples(btn.dataset.subIds.split(",").map(Number));
  });

  // Same event-delegation pattern for the submissions table: clicking a
  // student's name toggles their code open/closed in place, re-rendering from
  // the last-fetched rows (no extra request needed).
  document.getElementById("sub-body").addEventListener("click", (e) => {
    const btn = e.target.closest(".student-name-btn");
    if (!btn) return;
    const subId = Number(btn.dataset.subId);
    if (expandedSubIds.has(subId)) {
      expandedSubIds.delete(subId);
    } else {
      expandedSubIds.add(subId);
    }
    renderSubTable(lastSubRows);
  });

  poll();
  pollClusters();
  setInterval(poll, POLL_MS);
  setInterval(pollClusters, POLL_MS);
</script>
</body>
</html>
